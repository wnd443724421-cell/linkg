<div class="page overview-page">
    <div class="page-header">
        <h1 class="page-title">概览</h1>
        <p class="page-description">查看当前设备和组网的关键运行信息</p>
    </div>

    <section class="page-card">
        <div class="page-card-header">
            <h2 class="page-card-title">设备信息</h2>
        </div>

        <div class="overview-device-grid">
            <div class="overview-device-item">
                <span class="overview-device-label">设备角色</span>
                <span id="overviewDeviceRole" class="overview-device-value is-role">--</span>
            </div>

            <div class="overview-device-item">
                <span class="overview-device-label">本机节点</span>
                <span id="overviewDeviceNodeId" class="overview-device-value">--</span>
            </div>

            <div class="overview-device-item">
                <span class="overview-device-label">组网节点</span>
                <span id="overviewDeviceNetworkNodeCount" class="overview-device-value">--</span>
            </div>

            <div class="overview-device-item">
                <span class="overview-device-label">运行时间</span>
                <span id="overviewDeviceUptime" class="overview-device-value">--</span>
            </div>
        </div>
    </section>
</div>

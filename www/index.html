    <meta http-equiv="Expires" content="0">

                        <div class="menu-list">

    <!-- 全局Toast容器，后续由core/ui.js管理。 -->
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>

    <!-- Web版本Bootstrap -->
    <script>
        (function () {
            "use strict";

            /**
             * 为静态资源URL添加Web版本号。
             */
            function buildVersionedUrl(path, version)
            {
                var separator = path.indexOf("?") >= 0 ? "&" : "?";

                return path + separator + "v=" + encodeURIComponent(version);
            }

            /**
             * 动态加载带Web版本号的CSS文件。
             */
            function loadStylesheet(path, version)
            {
                return new Promise(function (resolve, reject) {
                    var link = document.createElement("link");

                    link.rel = "stylesheet";
                    link.href = buildVersionedUrl(path, version);

                    link.onload = function () {
                        resolve();
                    };

                    link.onerror = function () {
                        reject(new Error("样式文件加载失败：" + path));
                    };

                    document.head.appendChild(link);
                });
            }


            /**
             * 动态加载带Web版本号的JavaScript文件。
             */
            function loadScript(path, version)
            {
                return new Promise(function (resolve, reject) {
                    var script = document.createElement("script");

                    script.src = buildVersionedUrl(path, version);

                    script.onload = function () {
                        resolve();
                    };

                    script.onerror = function () {
                        reject(new Error("脚本文件加载失败：" + path));
                    };

                    document.body.appendChild(script);
                });
            }

            /**
             * 初始化Web版本并加载基础样式。
             */
            async function bootstrap()
            {
                var currentUrl;
                var currentVersion;
                var latestVersion;
                var response;
                var versionInfo;

                try
                {
                    currentUrl = new URL(window.location.href);
                    currentVersion = currentUrl.searchParams.get("v");

                    response = await fetch("/version.json?t=" + Date.now(), {
                        cache: "no-store"
                    });

                    if (!response.ok)
                    {
                        throw new Error("版本文件请求失败");
                    }

                    versionInfo = await response.json();

                    if (!versionInfo ||
                        typeof versionInfo.version !== "string" ||
                        versionInfo.version.length === 0)
                    {
                        throw new Error("版本文件格式无效");
                    }

                    latestVersion = versionInfo.version;

                    if (currentVersion !== latestVersion)
                    {
                        currentUrl.searchParams.set("v", latestVersion);

                        window.location.replace(
                            currentUrl.pathname +
                            currentUrl.search +
                            currentUrl.hash
                        );

                        return;
                    }

                    window.LINKG_WEB_VERSION = latestVersion;

                    await Promise.all([
                        loadStylesheet("/css/base.css", latestVersion),
                        loadStylesheet("/css/layout.css", latestVersion),
                        loadStylesheet("/css/page.css", latestVersion),
                        loadStylesheet("/css/pages/overview.css", latestVersion),
                        loadStylesheet("/css/pages/switch_status.css", latestVersion),
                        loadStylesheet("/css/pages/link_wifi.css", latestVersion),
                        loadStylesheet("/css/pages/link_cellular.css", latestVersion)
                    ]);
                    await loadScript("/js/core/cache.js", latestVersion);
                    await loadScript("/js/api/http.js", latestVersion);
                    await loadScript("/js/api/header.js", latestVersion);
                    await loadScript("/js/api/overview.js", latestVersion);
                    await loadScript("/js/api/switch_status.js", latestVersion);
                    await loadScript("/js/api/wifi.js", latestVersion);
                    await loadScript("/js/api/cellular.js", latestVersion);
                    await loadScript("/js/pages/overview.js", latestVersion);
                    await loadScript("/js/pages/switch_status.js", latestVersion);
                    await loadScript("/js/pages/link_wifi.js", latestVersion);
                    await loadScript("/js/pages/link_cellular.js", latestVersion);
                    await loadScript("/js/pages/index.js", latestVersion);

                    document.documentElement.classList.remove("linkg-booting");
                }
                catch (error)
                {
                    document.documentElement.classList.remove("linkg-booting");

                    document.body.innerHTML =
                        "<div style=\"padding:40px;font-family:sans-serif;color:#344054;\">" +
                        "<h2>LinkG Web加载失败</h2>" +
                        "<p>" + error.message + "</p>" +
                        "</div>";
                }
            }

            bootstrap();
        })();
    </script>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
<title id="title">LinkG 宽带 Wi-Fi 一对一连接</title><desc id="desc">电脑通过网线连接设备 A，设备 A 为 AP 节点 1，通过 Wi-Fi 连接设备 B，即 STA 节点 2。</desc>
<rect width="1120" height="270" rx="14" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
<text x="560" y="35" fill="#172b4d" font-size="21" font-weight="700">宽带 Wi-Fi 一对一连接</text>
<g fill="#fff" stroke="#d7e1ef" stroke-width="2"><rect x="35" y="76" width="240" height="138" rx="10"/><rect x="440" y="76" width="245" height="138" rx="10"/><rect x="848" y="76" width="235" height="138" rx="10"/></g>
<g fill="#172b4d" font-size="22" font-weight="700"><text x="155" y="114">电脑</text><text x="562" y="114">设备 A · AP</text><text x="965" y="114">设备 B · STA</text></g>
<g fill="#4b607b" font-size="17"><text x="155" y="149">DHCP 或静态 IP ＋路由</text><text x="155" y="182">以太网接入</text><text x="562" y="149">节点 ID：1</text><text x="965" y="149">节点 ID：2</text></g>
<g fill="#245fc9" font-size="20" font-family="Consolas, monospace"><text x="562" y="182">172.28.1.1</text><text x="965" y="182">172.28.2.1</text></g>
<path d="M275 145H440" fill="none" stroke="#71859e" stroke-width="4"/><text x="357" y="127" font-size="16" fill="#4b607b">网线</text>
<path d="M685 145H848" fill="none" stroke="#2867d5" stroke-width="4" stroke-dasharray="8 6"/><text x="766" y="127" font-size="16" fill="#245fc9">Wi-Fi</text>
<text x="560" y="247" font-size="16" fill="#60748e">两台设备分别供电，天线连接完成后上电；两端以太网无需互连。</text>
</g></svg>

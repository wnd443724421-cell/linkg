<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">LinkG 一对一通信示意</title>
  <desc id="desc">控制端和远端业务设备通过以太网或串口连接两台 LinkG。AP 与 STA 之间具有 Wi-Fi 直连和经运营商网络的 4G/5G 蜂窝传输路径。本图表示通信关系，不表示硬件接口位置。</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1040" height="390" rx="16" fill="#f8fafc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <text x="520" y="34" font-size="20" font-weight="700" fill="#0f172a">LinkG 一对一通信</text>
    <path d="M305 140V90H735V140" fill="none" stroke="#2563eb" stroke-width="3" marker-start="url(#blue)" marker-end="url(#blue)"/>
    <text x="520" y="74" font-size="17" fill="#1d4ed8">Wi-Fi 直连</text>
    <path d="M305 240V310H420" fill="none" stroke="#0f766e" stroke-width="3" marker-start="url(#green)"/>
    <path d="M620 310H735V240" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#green)"/>
    <rect x="420" y="275" width="200" height="70" rx="35" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="520" y="305" font-size="17" font-weight="700" fill="#115e59">运营商网络</text>
    <text x="520" y="329" font-size="14" fill="#115e59">4G / 5G · IPv6</text>
    <path d="M175 190H220" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#gray)" marker-end="url(#gray)"/>
    <path d="M820 190H865" fill="none" stroke="#64748b" stroke-width="2" marker-start="url(#gray)" marker-end="url(#gray)"/>
    <text x="102" y="122" font-size="14" fill="#475569">以太网 / 串口</text>
    <text x="938" y="122" font-size="14" fill="#475569">以太网 / 串口</text>
    <rect x="25" y="140" width="150" height="100" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="100" y="181" font-size="18" font-weight="700" fill="#0f172a">控制端设备</text>
    <text x="100" y="210" font-size="14" fill="#475569">电脑 / 控制器</text>
    <rect x="220" y="140" width="170" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="305" y="180" font-size="22" font-weight="700" fill="#1e3a8a">LinkG AP</text>
    <text x="305" y="211" font-size="16" fill="#1d4ed8">管理节点</text>
    <rect x="650" y="140" width="170" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="735" y="180" font-size="22" font-weight="700" fill="#1e3a8a">LinkG STA</text>
    <text x="735" y="211" font-size="16" fill="#1d4ed8">接入节点</text>
    <rect x="865" y="140" width="150" height="100" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="940" y="181" font-size="18" font-weight="700" fill="#0f172a">远端业务设备</text>
    <text x="940" y="210" font-size="14" fill="#475569">摄像头 / 飞控等</text>
    <text x="520" y="376" font-size="13" fill="#64748b">双向箭头表示可双向通信；图示为通信关系，非实物接线图。</text>
  </g>
</svg>

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=amovlab
ignore_broadcast_ssid=0
channel=149

beacon_int=100
wmm_enabled=1
max_num_sta=16
rts_threshold=2347
fragm_threshold=2346

auth_algs=1
hw_mode=a
ieee80211n=1
ieee80211ac=1
ieee80211ax=1

# primary channel 149 的 HT secondary channel 在上方
ht_capab=[HT40+]

# VHT80（Wi-Fi 5）
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=155

# HE80（Wi-Fi 6）
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=155

# 不宣告 VHT SHORT-GI-80
vht_capab=[HTC-VHT]

wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=amovlab
ignore_broadcast_ssid=0
# 你的窄带信道 (例如 184)
channel=184

beacon_int=100
wmm_enabled=1
max_num_sta=16
rts_threshold=2347
fragm_threshold=2346

# --- 官方推荐的核心模式配置 ---
auth_algs=1
hw_mode=a
ieee80211n=0
ieee80211ac=0
ieee80211ax=0

# --- 加密配置 ---
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP


interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ssid=amovlab
ignore_broadcast_ssid=0
channel=149

beacon_int=100
wmm_enabled=1
max_num_sta=16
rts_threshold=2347
fragm_threshold=2346

auth_algs=1
hw_mode=a
ieee80211n=1
ieee80211ac=1
ieee80211ax=1

# 20/40 共用枚举值 0；没有 HT40 就实际使用 20 MHz
vht_oper_chwidth=0
he_oper_chwidth=0

wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

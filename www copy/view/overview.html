<div class="page overview-page">

    <div class="page-header">
        <h1 class="page-title">概览</h1>
        <p class="page-description">查看当前设备和组网的关键运行信息</p>
    </div>

    <!-- 设备信息 -->
    <section class="page-card overview-section">
        <div class="page-card-header">
            <h2 class="page-card-title">设备信息</h2>
        </div>

        <div class="overview-device-grid">
            <div class="overview-device-item">
                <span class="overview-device-label">设备角色</span>
                <span id="overviewDeviceRole" class="overview-device-value is-role">--</span>
            </div>

            <div class="overview-device-item">
                <span class="overview-device-label">本机节点</span>
                <span id="overviewDeviceNodeId" class="overview-device-value">--</span>
            </div>

            <div class="overview-device-item">
                <span class="overview-device-label" title="组网节点总数，包含本机">组网节点总数</span>
                <span id="overviewDeviceNetworkNodeCount" class="overview-device-value">--</span>
            </div>

            <div class="overview-device-item">
                <span class="overview-device-label">运行时间</span>
                <span id="overviewDeviceUptime" class="overview-device-value">--</span>
            </div>
        </div>
    </section>

    <!-- 本机链路状态 -->
    <div class="overview-status-grid overview-section">

        <section class="page-card overview-status-card">
            <div class="page-card-header overview-card-header">
                <h2 class="page-card-title">Wi-Fi 状态</h2>
                <a class="overview-card-link" href="#/link/wifi">查看详情</a>
            </div>

            <div class="overview-status-list">
                <div class="overview-status-row">
                    <span class="overview-status-label">模式</span>
                    <span id="overviewWifiMode" class="overview-status-value">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">SSID</span>
                    <span id="overviewWifiSsid" class="overview-status-value">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">工作模式</span>
                    <span id="overviewWifiWorkMode" class="overview-status-value">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">信道</span>
                    <span id="overviewWifiChannel" class="overview-status-value">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">噪声</span>
                    <span id="overviewWifiNoise" class="overview-status-value">--</span>
                </div>
            </div>
        </section>

        <section class="page-card overview-status-card">
            <div class="page-card-header overview-card-header">
                <h2 class="page-card-title">蜂窝状态</h2>
                <a class="overview-card-link" href="#/link/cellular">查看详情</a>
            </div>

            <div class="overview-status-list">
                <div class="overview-status-row">
                    <span class="overview-status-label">运营商</span>
                    <span id="overviewCellularOperator" class="overview-status-value">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">网络类型</span>
                    <span id="overviewCellularNetworkType" class="overview-status-value">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">IPv6</span>
                    <span id="overviewCellularIpv6" class="overview-status-value is-address">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">互联网</span>
                    <span id="overviewCellularInternet" class="overview-status-value overview-internet-state">--</span>
                </div>

                <div class="overview-status-row">
                    <span class="overview-status-label">信号强度</span>
                    <span id="overviewCellularRsrp" class="overview-status-value">--</span>
                </div>
            </div>
        </section>

    </div>

    <!-- 组网节点 -->
    <section class="page-card overview-section">
        <div class="page-card-header overview-card-header">
            <h2 class="page-card-title">组网节点</h2>
            <span id="overviewNodesCount" class="overview-card-meta">--</span>
        </div>

        <div class="overview-table-wrap">
            <table class="overview-node-table" aria-label="组网节点与实时收发速率">
                <colgroup>
                    <col class="node-col-id">
                    <col class="node-col-ip">
                    <col class="node-col-relation">
                    <col class="node-col-link">
                    <col class="node-col-path">
                    <col class="node-col-path">
                    <col class="node-col-rate">
                    <col class="node-col-rate">
                </colgroup>
                <thead>
                    <tr>
                        <th>节点</th>
                        <th>虚拟 IP</th>
                        <th>关系</th>
                        <th>主链路</th>
                        <th>Wi-Fi</th>
                        <th>蜂窝</th>
                        <th title="发送速率">TX <span class="overview-table-unit">发送</span></th>
                        <th title="接收速率">RX <span class="overview-table-unit">接收</span></th>
                    </tr>
                </thead>

                <tbody id="overviewNodesBody">
                    <tr><td colspan="8" class="overview-table-empty">正在读取节点信息…</td></tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
